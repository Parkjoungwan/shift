<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>근무 관리</title>
<style>
  :root { --bg:#16181d; --panel:#20242c; --line:#343a46; --text:#e6e8ec; --dim:#98a0ae; --accent:#f0c040; --bad:#e06060; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.5 system-ui, "Malgun Gothic", sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  h1 { font-size:16px; margin:0 0 12px; }
  h2 { font-size:13px; color:var(--dim); margin:0 0 8px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px; margin-bottom:10px; overflow-x:auto; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  input { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:6px 8px; }
  button { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:4px 10px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); }
  button.bad { color:var(--bad); }
  table { border-collapse:collapse; width:100%; }
  th, td { text-align:left; padding:4px 8px; border-bottom:1px solid var(--line); white-space:nowrap; vertical-align:middle; }
  th { color:var(--dim); font-weight:600; }
  canvas { background:#f4ecd0; border-radius:3px; display:block; }
  .cid { font-family:ui-monospace, Consolas, monospace; font-size:11px; color:var(--dim); }
  .tag { padding:1px 6px; border-radius:3px; background:#0006; }
  .tag.hidden, .tag.deleted, .tag.rejected { color:var(--bad); }
  .tag.blur { color:var(--accent); }
  #msg { color:var(--accent); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>근무 관리</h1>

  <div class="panel" id="login">
    <h2>관리 토큰</h2>
    <form class="bar" id="loginForm">
      <input id="token" type="password" autocomplete="off" size="40" aria-label="관리 토큰">
      <button type="submit">접속</button>
      <span id="msg"></span>
    </form>
  </div>

  <div id="app" hidden>
    <div class="panel">
      <h2>현장</h2>
      <div class="bar">
        <span id="summary"></span>
        <button id="kick" class="bad">현재 근무자 강제 퇴근</button>
        <button id="rollback" class="bad">이전 근무 시점으로 되돌리기</button>
        <a href="../" target="_blank" rel="noopener" style="color:var(--accent)">실시간 관전 열기</a>
        <label>근무 시간(초) <input id="shiftSec" type="number" min="2" max="600" style="width:80px"></label>
        <button id="setShift">적용</button>
        <label>실험실 <select id="labSel"><option value="1">1 입사</option><option value="11">1-2 교대 순서</option><option value="2">2 상자</option><option value="12">2-2 안전 매트</option><option value="3">3 기호</option><option value="13">3-2 갈라진 기호</option><option value="4">4 엘리베이터</option><option value="14">4-2 잔상 안무</option><option value="5">5 서명</option><option value="15">5-2 위상 낙하</option><option value="9">9 퇴근</option></select></label>
        <button id="setLab" class="bad">이 실험실부터 다시</button>
        <button id="logout">토큰 지우기</button>
      </div>
    </div>
    <div class="panel"><h2>접속자</h2><table id="conns"></table></div>
    <div class="panel"><h2>쪽지 (신고 많은 순)</h2><table id="notes"></table></div>
    <div class="panel"><h2>근무일지</h2><table id="log"></table></div>
    <div class="panel"><h2>차단 목록</h2><table id="bans"></table></div>
    <div class="panel"><h2>조치 기록</h2><table id="actions"></table></div>
  </div>
</main>
<script type="module" src="admin.js"></script>
</body>
</html>
